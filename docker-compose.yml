version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: mo-insight-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  mo-insight:
    build: .
    container_name: mo-insight-app
    depends_on:
      - ollama
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.5:4b}
    volumes:
      - ./data:/app/data
      - warehouse_data:/app
      - chroma_data:/app/chroma_db
    restart: unless-stopped

volumes:
  ollama_data:
  warehouse_data:
  chroma_data:
